<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StaySync Availability Manager</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; color: #1f2937; }
      .grid { display: grid; grid-template-columns: repeat(7, minmax(90px, 1fr)); gap: 8px; margin-top: 16px; }
      .day { border: 1px solid #d1d5db; padding: 8px; border-radius: 8px; background: #f9fafb; }
      .day.booked { background: #fee2e2; }
      .day.blocked { background: #fde68a; }
      .controls { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
      button { padding: 8px 12px; border: none; border-radius: 6px; background: #2563eb; color: white; cursor: pointer; }
      select, input { padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; }
      #status { margin-top: 12px; min-height: 20px; }
    </style>
  </head>
  <body>
    <h1>StaySync Availability Manager</h1>
    <p>Manage rates, blocks, and bookings for Seaside Cottage.</p>

    <div class="controls">
      <input id="start" type="date" />
      <input id="end" type="date" />
      <input id="rate" type="number" value="150" />
      <button onclick="setRate()">Set rate</button>
      <button onclick="toggleBlock(true)">Block</button>
      <button onclick="toggleBlock(false)">Unblock</button>
      <button onclick="createBooking()">New booking</button>
    </div>

    <div class="controls">
      <input id="guest" placeholder="Guest name" />
      <button onclick="importFeed()">Import mock feed</button>
    </div>

    <div id="status"></div>
    <div id="calendar" class="grid"></div>

    <script>
      const state = { days: [] };
      async function loadCalendar() {
        const response = await fetch('/calendar');
        state.days = await response.json();
        render();
      }

      function render() {
        const calendar = document.getElementById('calendar');
        calendar.innerHTML = '';
        state.days.forEach((day) => {
          const div = document.createElement('div');
          div.className = `day ${day.status}`;
          div.innerHTML = `<strong>${day.date}</strong><br/>£${day.rate}<br/>${day.status}`;
          calendar.appendChild(div);
        });
      }

      async function setRate() {
        const start = document.getElementById('start').value;
        const end = document.getElementById('end').value;
        const rate = document.getElementById('rate').value;
        const response = await fetch('/rate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ start, end, rate: Number(rate) }) });
        state.days = await response.json();
        render();
      }

      async function toggleBlock(blocked) {
        const start = document.getElementById('start').value;
        const end = document.getElementById('end').value;
        const response = await fetch('/block', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ start, end, blocked }) });
        state.days = await response.json();
        render();
      }

      async function createBooking() {
        const start = document.getElementById('start').value;
        const end = document.getElementById('end').value;
        const guest = document.getElementById('guest').value;
        const response = await fetch('/bookings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ start, end, guest }) });
        const body = await response.json();
        if (!response.ok) {
          document.getElementById('status').textContent = body.error || 'Unable to create booking';
          return;
        }
        state.days = body;
        render();
      }

      async function importFeed() {
        const reservations = [
          { id: '1001', guest: 'John D.', checkIn: '2026-08-10', checkOut: '2026-08-12' },
          { id: '1002', guest: 'Maria S.', checkIn: '2026-08-15', checkOut: '2026-08-17' },
          { id: '1001', guest: 'John D.', checkIn: '2026-08-10', checkOut: '2026-08-12' },
          { id: '0999', guest: '—', checkIn: '2026-08-01', checkOut: '2026-08-02', status: 'cancelled' },
          { id: '1003', guest: 'Sam P.', checkIn: '2026-08-13', checkOut: '2026-08-15' }
        ];
        const response = await fetch('/import', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(reservations) });
        const body = await response.json();
        document.getElementById('status').textContent = `Imported ${body.result.imported} reservations; duplicates ${body.result.duplicates}; cancelled ${body.result.cancelled}; conflicts ${body.result.conflicts}`;
        state.days = body.calendar;
        render();
      }

      loadCalendar();
    </script>
  </body>
</html>
